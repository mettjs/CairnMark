name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: build / vet / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  integration:
    name: integration (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    # The substrate is started from the project's own compose files rather than
    # GitHub `services:` — Actions service containers can't pass a command, which
    # some substrates need to boot. Reusing compose also dogfoods exactly what a
    # self-hoster runs, overlay flags and all.
    #
    # Every backend the README offers is tested here. A backend that ships as a
    # supported option but is only exercised by hand is a backend that breaks
    # quietly, so adding a row to the README's table means adding one here too.
    strategy:
      # Run all three even after one fails: knowing whether a break is
      # backend-specific or common to all of them is most of the diagnosis.
      fail-fast: false
      matrix:
        backend:
          - name: rustfs (default)
            files: -f docker-compose.yml
            service: rustfs
            endpoint: localhost:9000
          - name: minio
            files: -f docker-compose.yml -f compose.minio.yml
            service: minio
            endpoint: localhost:9000
          - name: seaweedfs
            files: -f docker-compose.yml -f compose.seaweedfs.yml
            service: seaweedfs
            endpoint: localhost:8333
    env:
      CAIRNMARK_POSTGRES_DSN: postgres://cairnmark:cairnmark@localhost:5432/cairnmark?sslmode=disable
      CAIRNMARK_S3_ENDPOINT: ${{ matrix.backend.endpoint }}
      CAIRNMARK_S3_ACCESS_KEY: cairnmark
      CAIRNMARK_S3_SECRET_KEY: cairnmark-secret
      CAIRNMARK_S3_BUCKET: cairnmark-it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # Brings up the WHOLE stack, app container included, not just the
      # substrate. The app service is the only thing that exercises what an
      # overlay actually does — the `depends_on: !override` and the rewritten
      # CAIRNMARK_S3_ENDPOINT. Starting only the substrate would leave a broken
      # overlay green here and failing for anyone following the README.
      # SeaweedFS takes ~20s to become healthy; the timeout suits the slowest.
      - name: Start full stack on ${{ matrix.backend.service }}
        run: >
          docker compose ${{ matrix.backend.files }}
          up -d --build --wait --wait-timeout 300
      - name: Integration tests
        # Explicit timeout: the suite writes ~2,400 objects and a 24 MiB
        # multipart upload per run, which can crowd Go's 10m default on a slow
        # backend — and blowing that panics the binary instead of failing a test,
        # so t.Cleanup never runs and objects leak into the bucket.
        run: go test -tags=integration -timeout 20m ./...
      - name: Dump container logs on failure
        if: failure()
        run: docker compose ${{ matrix.backend.files }} logs --no-color
      - name: Tear down
        if: always()
        run: docker compose ${{ matrix.backend.files }} down -v
