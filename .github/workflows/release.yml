name: Release

on:
  # Only the tag push is wired up, not `release: [published]` — every release in
  # this repo is cut from a tag that already fires this job, so listening for
  # both would just race two runs pushing identical tags.
  push:
    tags: [v*]
  # Manual runs are a re-push escape hatch. From a branch the semver patterns
  # yield nothing, so a `sha-` tag stands in to keep the push valid.
  workflow_dispatch:

jobs:
  image:
    name: build / push image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The Dockerfile compiles Go inside the build stage with no TARGETARCH
      # handling, so the arm64 leg is emulated under QEMU rather than cross-built.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Spelled out rather than ${{ github.repository }}: that expands to
          # mettjs/CairnMark and Docker rejects uppercase in an image reference.
          images: ghcr.io/mettjs/cairnmark
          # `latest` is opt-in so a prerelease (v1.2.0-rc1) never claims it, and
          # neither does a manual dispatch from a branch.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
