# Overlay: run the stack on MinIO instead of the default RustFS.
#
#   docker compose -f docker-compose.yml -f compose.minio.yml up -d --build
#
# SWITCHING BACKENDS REQUIRES A TEARDOWN FIRST:
#
#   docker compose down            # or `down -v` to discard the data too
#   docker compose -f docker-compose.yml -f compose.minio.yml up -d --build
#
# Compose will not stop the default substrate on your behalf: a service parked
# in an inactive profile is still a *defined* service, not an orphan, so
# `--remove-orphans` leaves it running. It keeps its published ports, the
# incoming substrate fails to bind them ("port is already allocated"), and you
# end up with a half-started stack. `down` first and the swap is clean.
#
# Nothing in CairnMark is backend-specific — this overlay only swaps the
# substrate container and repoints the service's two S3 endpoint vars.
#
# Two Compose mechanics make this work, both non-obvious:
#   1. `depends_on` MERGES across files rather than being replaced, so without
#      `!override` the base file's `rustfs` entry survives here and Compose
#      rejects the project ("depends on undefined service rustfs").
#   2. `rustfs` is parked in a profile that is never activated, so it stays
#      defined (satisfying any lingering reference) but never starts.
services:
  cairnmark:
    depends_on: !override
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CAIRNMARK_S3_ENDPOINT: "minio:9000"            # internal: service → MinIO
      CAIRNMARK_S3_PUBLIC_ENDPOINT: "localhost:9000" # external: presigned URLs

  rustfs:
    profiles: ["donotstart"]

  # Pinned to the last MinIO community release, pulled from quay.io.
  #
  # MinIO stopped publishing community binaries on 2025-10-23 and pulled its
  # Docker Hub images; `minio/minio:latest` no longer resolves and the upstream
  # server repo is archived. The quay.io mirror still serves the tagged
  # community releases, so this pin is the last build that can be pulled without
  # compiling from source. It is deliberately a fixed tag, not `:latest` — there
  # will be no newer community release, and an unpinned tag can only break.
  #
  # This release still ships the full AGPL web console at the ROOT of 9001
  # (later builds stripped it) and still bundles `mc`, which the healthcheck
  # below uses.
  #
  # Known gap: it predates the fix for CVE-2025-62506 (privilege escalation via
  # session-policy bypass, RELEASE.2025-10-15T17-29-55Z). Exploiting it requires
  # credentials for a *restricted service or STS account*; this stack creates
  # neither — CairnMark authenticates with the root credential alone and never
  # mints service accounts — so the precondition does not exist here. Do not
  # hand out scoped service-account keys from this deployment.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cairnmark
      MINIO_ROOT_PASSWORD: cairnmark-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (at the root: http://localhost:9001)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  miniodata:
